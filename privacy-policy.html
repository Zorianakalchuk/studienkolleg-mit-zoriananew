<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакти</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
}

.title {
    font-size: 22px;
    margin-bottom: 20px;
}
/* контейнер */
.container {
    display: flex;
    gap: 15px;
}

/* кнопки */
.btn {
    text-decoration: none;
    padding: 15px 25px;
    background: #007BFF;
    color: white;
    border-radius: 10px;
    font-size: 18px;
    text-align: center;
    min-width: 140px;
    transition: 0.3s;
}

.btn:hover {
    background: #0056b3;
}

/* 📱 Телефон */
@media (max-width: 600px) {
    .container {
        flex-direction: column;
        width: 90%;
    }

    .btn {
        width: 100%;
        font-size: 20px;
    }
}

/* 📲 Планшет */
@media (min-width: 601px) and (max-width: 1024px) {
    .container {
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        flex: 1 1 40%;
        font-size: 19px;
    }
}

/* 💻 Комп */
@media (min-width: 1025px) {
    .btn {
        font-size: 18px;
    }
}
</style>

</head>

<body>
   
<div class="container">
    <div class="title">
        Через який месенджер вам буде зручно придбати?
    </div>
    <a class="btn" href="https://t.me/zoriana_studienkolleg" target="_blank">Telegram</a>
    <a class="btn" href="https://wa.me/1605961417" target="_blank">WhatsApp</a>
    <a class="btn" href="https://instagram.com/studienkolleg_mit_zoriana" target="_blank">Instagram</a>
</div>

</body>
</html>
